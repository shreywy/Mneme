name: Keep Supabase awake

# Free projects pause after 7 days without database activity. This runs a trivial query twice a week.
on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call keepalive()
        env:
          # Both are public: they ship in the site's JavaScript. Row-level security does the protecting.
          SUPABASE_URL: https://xjlwbzqmawgffkmjixhx.supabase.co
          SUPABASE_KEY: sb_publishable_iXBJNZLZJuRkOStesRRSHA_onP79AJ8
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
